# Publish the browser version of SASSI-EDU on GitHub Pages (web/README.md).
#
# On every push to main: build the static site with web/build.py (Python + the plotly package, for
# Plotly.js) and deploy web/site/.  Python itself runs in the visitor's browser (Pyodide from the jsDelivr
# CDN), so the site is plain static files.  One-time setup: Settings > Pages > Source: GitHub Actions.
name: Deploy the web version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotly (Plotly.js for the page)
        run: python -m pip install plotly
      - name: Build the site
        run: python web/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
